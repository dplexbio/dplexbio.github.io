<svg aria-label="Conceptual illustration: larger droplets improve detection probability at low target concentration; smaller droplets remain informative at higher concentration, together extending the quantifiable range." role="img" viewbox="0 0 660 490" xmlns="http://www.w3.org/2000/svg"><defs><lineargradient id="bgd" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f3f9ff"></stop><stop offset="1" stop-color="#e5f1fd"></stop></lineargradient><radialgradient id="drop"><stop stop-color="#e3f6ff"></stop><stop offset=".7" stop-color="#92c9f4"></stop><stop offset="1" stop-color="#368bd1"></stop></radialgradient><radialgradient id="positive"><stop stop-color="#d5fbff"></stop><stop offset=".65" stop-color="#46b3eb"></stop><stop offset="1" stop-color="#0861b8"></stop></radialgradient></defs><rect fill="url(#bgd)" height="488" rx="19" stroke="#d0e3f2" width="658" x="1" y="1"></rect><text fill="#0b2944" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="330" y="34">Variable droplet sizes</text><text fill="#0b2944" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="330" y="65">expand the dynamic range of digital PCR</text><rect fill="#fff" height="305" rx="15" stroke="#d5e5f2" width="290" x="28" y="91"></rect><rect fill="#fff" height="305" rx="15" stroke="#d5e5f2" width="290" x="342" y="91"></rect><text fill="#153d62" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="173" y="121">LOW TARGET CONCENTRATION</text><text fill="#153d62" font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" x="487" y="121">HIGH TARGET CONCENTRATION</text><text fill="#57718a" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" x="173" y="143">Larger droplets sample more volume</text><text fill="#57718a" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" x="487" y="143">Smaller droplets avoid saturation</text><circle cx="83" cy="198